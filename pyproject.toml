[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-demo"
version = "0.1.0"
description = "Python 复刻 deepseek-harness 架构的 agent 框架（教学 + 个人工具）"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "httpx>=0.27",
    "fastapi>=0.141",
    "uvicorn>=0.52",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
    "mypy>=1.11",
]

[project.scripts]
agent-demo = "agent_demo.cli:main"
agent-demo-web = "agent_demo.web_app:main"

[tool.setuptools.packages.find]
include = ["agent_demo*"]

[tool.setuptools.package-data]
agent_demo = []

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 110
target-version = "py311"
exclude = ["web/vendor"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.11"
files = ["agent_demo"]
ignore_missing_imports = true
# 教学代码的工具 executor 刻意不写参数注解（args: dict 由 ToolSpec schema 约束）；
# 未注解函数体不深查，聚焦有注解代码里的真问题
check_untyped_defs = false
