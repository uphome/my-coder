<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>agent-demo</title>
<style>
  :root {
    --bg: #171717; --panel: #1f1f1f; --border: #2e2e2e;
    --text: #e5e5e5; --muted: #9a9a9a;
    --user-bubble: #2b5bff; --thinking-bg: #202020;
    --tool-call: #c9a227; --tool-result: #8a8a8a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg); color: var(--text);
    font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
    display: flex; flex-direction: column;
  }
  header {
    padding: 12px 20px; background: var(--panel);
    border-bottom: 1px solid var(--border);
    display: flex; justify-content: space-between; align-items: center;
  }
  header h1 { font-size: 15px; font-weight: 600; }
  header span { font-size: 12px; color: var(--muted); }
  main { flex: 1; overflow-y: auto; padding: 20px 0 40px; }
  .msg { max-width: 780px; margin: 0 auto 20px; padding: 0 20px; }
  .msg.user { display: flex; justify-content: flex-end; }
  .user .bubble {
    background: var(--user-bubble); color: #fff;
    padding: 10px 14px; border-radius: 12px;
    max-width: 70%; white-space: pre-wrap; word-break: break-word;
  }
  .msg.assistant .text {
    white-space: pre-wrap; word-break: break-word; line-height: 1.6;
  }
  /* 思考折叠块（仿 DeepSeek） */
  .thinking {
    margin-bottom: 10px; background: var(--thinking-bg);
    border: 1px solid var(--border); border-radius: 8px;
    overflow: hidden;
  }
  .thinking-toggle {
    width: 100%; padding: 8px 12px; text-align: left;
    background: none; border: none; color: var(--muted);
    font-size: 13px; cursor: pointer;
    display: flex; align-items: center; gap: 6px;
  }
  .thinking-toggle .arrow { transition: transform .15s; }
  .thinking.open .arrow { transform: rotate(90deg); }
  .thinking-body {
    padding: 8px 12px 12px; font-size: 13px; color: var(--muted);
    white-space: pre-wrap; word-break: break-word; line-height: 1.5;
  }
  /* 工具卡片 */
  .tool-cards { margin-bottom: 10px; display: flex; flex-direction: column; gap: 6px; }
  .tool-card {
    border-radius: 6px; padding: 6px 10px; font-size: 12px;
    font-family: Consolas, monospace; word-break: break-all;
  }
  .tool-card.call { border: 1px solid var(--tool-call); color: var(--tool-call); }
  .tool-card.result { border: 1px solid var(--border); color: var(--tool-result); }
  .tool-card.error { border-color: #d14545; color: #d14545; }
  footer {
    padding: 12px 20px 16px; background: var(--panel);
    border-top: 1px solid var(--border);
  }
  #input-row {
    max-width: 780px; margin: 0 auto; display: flex; gap: 8px;
  }
  textarea {
    flex: 1; resize: none; background: var(--bg);
    border: 1px solid var(--border); border-radius: 8px;
    color: var(--text); padding: 10px 12px; font-size: 14px;
    font-family: inherit; outline: none;
  }
  textarea:focus { border-color: var(--user-bubble); }
  button {
    border: none; border-radius: 8px; padding: 10px 18px;
    font-size: 14px; cursor: pointer; color: #fff; background: var(--user-bubble);
  }
  button:disabled { opacity: .5; cursor: not-allowed; }
  #stop { background: #555; }
  .hint { max-width: 780px; margin: 40px auto 0; padding: 0 20px; color: var(--muted); font-size: 13px; text-align: center; }
</style>
</head>
<body>
<header>
  <h1>agent-demo</h1>
  <span id="model-label">…</span>
</header>
<main id="messages">
  <div class="hint">输入任务开始对话——模型可以读文件、搜索代码、执行命令（敏感操作会被拒绝，直到 Web 版 approval 落地）。</div>
</main>
<footer>
  <div id="input-row">
    <textarea id="input" rows="1" placeholder="给 agent 一个任务…" autofocus></textarea>
    <button id="send">发送</button>
    <button id="stop" hidden>停止</button>
  </div>
</footer>
<script>
'use strict';
const messagesEl = document.getElementById('messages');
const input = document.getElementById('input');
const sendBtn = document.getElementById('send');
const stopBtn = document.getElementById('stop');

let current = null;      // 当前 assistant 消息节点
let currentThinking = null;
let currentCards = null;
let controller = null;

/* ---------- DOM 工具 ---------- */
function el(tag, className) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  return node;
}

function addUserMessage(text) {
  const row = el('div', 'msg user');
  const bubble = el('div', 'bubble');
  bubble.textContent = text;
  row.appendChild(bubble);
  messagesEl.appendChild(row);
  scrollBottom();
}

function ensureAssistant() {
  if (current) return current;
  current = el('div', 'msg assistant');
  currentThinking = null;
  currentCards = el('div', 'tool-cards');
  current.appendChild(currentCards);
  const text = el('div', 'text');
  current.appendChild(text);
  messagesEl.appendChild(current);
  return current;
}

function scrollBottom() { messagesEl.scrollTop = messagesEl.scrollHeight; }

function makeThinking() {
  const box = el('div', 'thinking');
  const toggle = el('button', 'thinking-toggle');
  toggle.innerHTML = '<span class="arrow">▶</span><span>已深度思考</span>';
  const body = el('div', 'thinking-body');
  body.hidden = true;
  toggle.addEventListener('click', () => {
    const open = box.classList.toggle('open');
    body.hidden = !open;
  });
  box.appendChild(toggle);
  box.appendChild(body);
  return { box, body };
}

function addToolCall(name, argsText) {
  ensureAssistant();
  const card = el('div', 'tool-card call');
  card.textContent = `▶ ${name}(${argsText})`;
  currentCards.appendChild(card);
  scrollBottom();
}

function addToolResult(content, isError) {
  const card = el('div', 'tool-card result' + (isError ? ' error' : ''));
  card.textContent = content;
  currentCards.appendChild(card);
  scrollBottom();
}

/* ---------- 历史加载 ---------- */
async function loadHistory() {
  try {
    const res = await fetch('/history');
    const history = await res.json();
    for (const m of history) {
      if (m.role === 'user') {
        addUserMessage(m.text);
      } else if (m.role === 'assistant') {
        ensureAssistant();
        if (m.tool_calls.length) {
          for (const t of m.tool_calls) addToolCall(t.name, t.arguments);
        }
        if (m.tool_results.length) {
          for (const r of m.tool_results) addToolResult(r.content, r.is_error);
        }
        if (m.text) {
          current.querySelector('.text').textContent = m.text;
        }
        current = null; currentThinking = null; currentCards = null;
      }
    }
  } catch (e) { console.error('load history failed', e); }
}

/* ---------- SSE 流解析 ---------- */
function handle(payload) {
  switch (payload.type) {
    case 'chunk':
      ensureAssistant();
      current.querySelector('.text').textContent += payload.text;
      scrollBottom();
      break;
    case 'reasoning': {
      ensureAssistant();
      if (!currentThinking) {
        const t = makeThinking();
        current.insertBefore(t.box, current.firstChild);
        currentThinking = t;
      }
      currentThinking.body.textContent += payload.text;
      break;
    }
    case 'tool_call':
      addToolCall(payload.name, payload.arguments);
      break;
    case 'tool_result':
      addToolResult(payload.content, payload.is_error);
      break;
    case 'turn_end':
      break;
  }
}

async function send() {
  const text = input.value.trim();
  if (!text) return;
  addUserMessage(text);
  input.value = '';
  controller = new AbortController();
  setBusy(true);
  try {
    const res = await fetch('/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: text }),
      signal: controller.signal,
    });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buf = '';
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });
      let idx;
      while ((idx = buf.indexOf('\n\n')) >= 0) {
        const frame = buf.slice(0, idx);
        buf = buf.slice(idx + 2);
        if (!frame.startsWith('data: ')) continue;
        try { handle(JSON.parse(frame.slice(6))); } catch (e) { console.error('bad frame', e); }
      }
    }
  } catch (e) {
    if (e.name !== 'AbortError') console.error(e);
  } finally {
    current = null; currentThinking = null; currentCards = null;
    setBusy(false);
  }
}

function setBusy(busy) {
  sendBtn.disabled = busy;
  input.disabled = busy;
  stopBtn.hidden = !busy;
  sendBtn.textContent = busy ? '…' : '发送';
}

/* ---------- 事件绑定 ---------- */
sendBtn.addEventListener('click', send);
stopBtn.addEventListener('click', () => {
  if (controller) { controller.abort(); stopBtn.hidden = true; }
});
input.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
});
input.addEventListener('input', () => {
  input.style.height = 'auto';
  input.style.height = Math.min(input.scrollHeight, 160) + 'px';
});

loadHistory();
</script>
</body>
</html>
