<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>agent-demo</title>
<style>
  :root {
    --bg: #171717; --panel: #1f1f1f; --border: #2e2e2e;
    --text: #e5e5e5; --muted: #9a9a9a;
    --user-bubble: #2b5bff; --thinking-bg: #202020;
    --tool-call: #c9a227; --tool-result: #8a8a8a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: var(--bg); color: var(--text);
    font-family: -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif;
  }
  #layout { display: flex; height: 100%; }
  /* 左侧会话栏（仿 DeepSeek） */
  #sidebar {
    width: 250px; min-width: 250px; background: var(--panel);
    border-right: 1px solid var(--border);
    display: flex; flex-direction: column;
  }
  #new-btn {
    margin: 12px; padding: 8px; border: 1px dashed var(--border);
    border-radius: 8px; background: none; color: var(--muted);
    font-size: 13px; cursor: pointer;
  }
  #new-btn:hover { color: var(--text); border-color: var(--muted); }
  #session-list { flex: 1; overflow-y: auto; padding-bottom: 12px; }
  .session-item {
    position: relative;
    padding: 9px 26px 9px 14px; cursor: pointer;
    border-left: 2px solid transparent;
  }
  .session-item:hover { background: var(--thinking-bg); }
  .session-item.active { background: var(--thinking-bg); border-left-color: var(--user-bubble); }
  /* 删除按钮：用更高优先级覆盖全局 button 的蓝色背景（button 规则在后面） */
  .session-item .session-del {
    position: absolute; right: 6px; top: 50%; transform: translateY(-50%);
    background: none; border: none; color: var(--muted);
    font-size: 16px; line-height: 1; cursor: pointer;
    padding: 2px 6px; border-radius: 4px;
  }
  .session-del:hover { color: #d14545; background: rgba(209, 69, 69, .15); }
  .session-item .title {
    font-size: 13px; white-space: nowrap; overflow: hidden;
    text-overflow: ellipsis;
  }
  .session-item .meta { font-size: 11px; color: var(--muted); margin-top: 2px; }
  #main-col { flex: 1; min-width: 0; display: flex; flex-direction: column; }
  header {
    padding: 12px 20px; background: var(--panel);
    border-bottom: 1px solid var(--border);
    display: flex; justify-content: space-between; align-items: center;
  }
  header h1 { font-size: 15px; font-weight: 600; }
  header span { font-size: 12px; color: var(--muted); }
  main { flex: 1; overflow-y: auto; padding: 20px 0 40px; }
  .msg { max-width: 780px; margin: 0 auto 20px; padding: 0 20px; }
  .msg.user { display: flex; justify-content: flex-end; }
  .user .bubble {
    background: var(--user-bubble); color: #fff;
    padding: 10px 14px; border-radius: 12px;
    max-width: 70%; white-space: pre-wrap; word-break: break-word;
  }
  .msg.assistant .text {
    white-space: pre-wrap; word-break: break-word; line-height: 1.6;
  }
  /* Markdown 渲染内容样式（marked 输出） */
  .msg.assistant .text > :first-child { margin-top: 0; }
  .msg.assistant .text p { margin: .5em 0; }
  .msg.assistant .text h1, .msg.assistant .text h2, .msg.assistant .text h3,
  .msg.assistant .text h4 { margin: 1em 0 .4em; line-height: 1.3; }
  .msg.assistant .text h1 { font-size: 1.4em; }
  .msg.assistant .text h2 { font-size: 1.25em; }
  .msg.assistant .text h3 { font-size: 1.1em; }
  .msg.assistant .text ul, .msg.assistant .text ol { padding-left: 1.6em; margin: .5em 0; }
  .msg.assistant .text pre {
    background: #101010; border: 1px solid var(--border); border-radius: 8px;
    padding: 10px 12px; overflow-x: auto; margin: .7em 0; line-height: 1.45;
  }
  .msg.assistant .text code {
    font-family: Consolas, "Courier New", monospace; font-size: .88em;
    background: #101010; padding: 1px 5px; border-radius: 4px;
  }
  .msg.assistant .text pre code { background: none; padding: 0; }
  .msg.assistant .text a { color: #6ea8fe; text-decoration: none; }
  .msg.assistant .text a:hover { text-decoration: underline; }
  .msg.assistant .text table { border-collapse: collapse; margin: .7em 0; font-size: .92em; }
  .msg.assistant .text th, .msg.assistant .text td {
    border: 1px solid var(--border); padding: 5px 12px;
  }
  .msg.assistant .text th { background: var(--thinking-bg); }
  .msg.assistant .text blockquote {
    border-left: 3px solid var(--border); margin: .6em 0;
    padding: 2px 0 2px 12px; color: var(--muted);
  }
  .msg.assistant .text hr { border: none; border-top: 1px solid var(--border); margin: 1em 0; }
  /* 思考折叠块（仿 DeepSeek） */
  .thinking {
    margin-bottom: 10px; background: var(--thinking-bg);
    border: 1px solid var(--border); border-radius: 8px;
    overflow: hidden;
  }
  /* 思考折叠块按钮：高优先级覆盖全局 button 的蓝色背景（button 规则在后面） */
  .thinking .thinking-toggle {
    width: 100%; padding: 8px 12px; text-align: left;
    background: none; border: none; color: var(--muted);
    font-size: 13px; cursor: pointer;
    display: flex; align-items: center; gap: 6px;
  }
  .thinking-toggle .arrow { transition: transform .15s; }
  .thinking.open .arrow { transform: rotate(90deg); }
  .thinking-body {
    padding: 8px 12px 12px; font-size: 13px; color: var(--muted);
    white-space: pre-wrap; word-break: break-word; line-height: 1.5;
  }
  /* 工具卡片 */
  /* 回合分隔线：标识新回合开始（历史/多回合里不再"突兀冒出"用户消息） */
  .turn-sep {
    display: flex; align-items: center; gap: 10px;
    margin: 20px 0 12px; color: var(--muted);
    font-size: 11px; font-weight: 600;
  }
  .turn-sep::before, .turn-sep::after {
    content: ''; flex: 1; border-top: 1px solid var(--border);
  }
  /* 工具活动折叠块：连续工具调用收成一行可展开（解决卡片刷屏） */
  .tool-activity {
    margin-bottom: 10px; border: 1px solid var(--border);
    border-radius: 8px; overflow: hidden;
  }
  .tool-activity-head {
    padding: 7px 12px; background: var(--thinking-bg);
    color: var(--muted); font-size: 12px; cursor: pointer;
    display: flex; align-items: center; gap: 6px;
    user-select: none;
  }
  .tool-activity-head:hover { color: var(--text); }
  .tool-activity-head .arrow { transition: transform .15s; }
  .tool-activity.open .arrow { transform: rotate(90deg); }
  .tool-activity-body {
    padding: 8px 12px 10px; display: flex; flex-direction: column; gap: 6px;
  }
  .tool-card {
    border-radius: 6px; padding: 6px 10px; font-size: 12px;
    font-family: Consolas, monospace; word-break: break-all;
  }
  .tool-card.call { border: 1px solid var(--tool-call); color: var(--tool-call); }
  .tool-card.result { border: 1px solid var(--border); color: var(--tool-result); }
  .tool-card.error { border-color: #d14545; color: #d14545; }
  footer {
    padding: 12px 20px 16px; background: var(--panel);
    border-top: 1px solid var(--border);
  }
  #input-row {
    max-width: 780px; margin: 0 auto; display: flex; gap: 8px;
  }
  textarea {
    flex: 1; resize: none; background: var(--bg);
    border: 1px solid var(--border); border-radius: 8px;
    color: var(--text); padding: 10px 12px; font-size: 14px;
    font-family: inherit; outline: none;
  }
  textarea:focus { border-color: var(--user-bubble); }
  button {
    border: none; border-radius: 8px; padding: 10px 18px;
    font-size: 14px; cursor: pointer; color: #fff; background: var(--user-bubble);
  }
  button:disabled { opacity: .5; cursor: not-allowed; }
  #stop { background: #555; }
  .hint { max-width: 780px; margin: 40px auto 0; padding: 0 20px; color: var(--muted); font-size: 13px; text-align: center; }
</style>
</head>
<body>
<div id="layout">
  <aside id="sidebar">
    <button id="new-btn">＋ 新建会话</button>
    <div id="session-list"></div>
  </aside>
  <section id="main-col">
    <header>
      <h1>agent-demo</h1>
      <span id="model-label">…</span>
    </header>
    <main id="messages">
      <div class="hint">选择一个会话，或新建会话开始对话——模型可以读文件、搜索代码、执行命令（Web 版 approval 落地前敏感操作会被拒绝）。</div>
    </main>
    <footer>
      <div id="input-row">
        <textarea id="input" rows="1" placeholder="给 agent 一个任务…" autofocus></textarea>
        <button id="send">发送</button>
        <button id="stop" hidden>停止</button>
      </div>
    </footer>
  </section>
</div>
<script src="vendor/marked.min.js"></script>
<script src="vendor/purify.min.js"></script>
<script>
'use strict';
const messagesEl = document.getElementById('messages');
const input = document.getElementById('input');
const sendBtn = document.getElementById('send');
const stopBtn = document.getElementById('stop');
const sessionListEl = document.getElementById('session-list');
const newBtn = document.getElementById('new-btn');

let current = null;      // 当前 assistant 消息节点
let currentThinking = null;
let currentRaw = '';     // 当前 assistant 文本的原始 markdown（流式累积）
let controller = null;
let currentSid = null;   // 当前会话 id（服务端 init 默认 'web'）
let busy = false;
let turnNo = 0;          // 回合计数（每条用户消息 = 新回合，用于分隔线）
let streaming = false;   // 是否正在实时流（工具活动块自动展开看进度）

/* ---------- DOM 工具 ---------- */
function el(tag, className) {
  const node = document.createElement(tag);
  if (className) node.className = className;
  return node;
}

function addUserMessage(text) {
  // 每条用户消息 = 一个新回合：先画分隔线（历史/多回合有清晰的回合边界）
  turnNo += 1;
  const sep = el('div', 'turn-sep');
  sep.textContent = `回合 ${turnNo}`;
  messagesEl.appendChild(sep);
  const row = el('div', 'msg user');
  const bubble = el('div', 'bubble');
  bubble.textContent = text;
  row.appendChild(bubble);
  messagesEl.appendChild(row);
  scrollBottom();
}

function ensureAssistant() {
  if (current) return current;
  current = el('div', 'msg assistant');
  currentThinking = null;
  current._activity = null;
  const text = el('div', 'text');
  current.appendChild(text);
  messagesEl.appendChild(current);
  return current;
}

/* 工具活动折叠块：同一条 assistant 消息内的连续工具调用收成可展开块 */
function ensureActivity() {
  if (current._activity) return current._activity;
  const box = el('div', 'tool-activity');
  const head = el('div', 'tool-activity-head');
  const arrow = el('span', 'arrow');
  arrow.textContent = '▶';
  const label = el('span');
  label.textContent = '工具活动';
  head.appendChild(arrow);
  head.appendChild(label);
  const body = el('div', 'tool-activity-body');
  body.hidden = true;            // 默认折叠
  box.appendChild(head);
  box.appendChild(body);
  head.addEventListener('click', () => {
    const open = box.classList.toggle('open');
    body.hidden = !open;
  });
  // 插在正文之前（思考块由 thinking 自己插到最前）
  current.insertBefore(box, current.querySelector('.text'));
  const activity = { box, head, body, label, count: 0 };
  current._activity = activity;
  return activity;
}

function scrollBottom() { messagesEl.scrollTop = messagesEl.scrollHeight; }

/* Markdown → 消毒 HTML（模型输出的 md 渲染，DOMPurify 拦脚本注入） */
function renderMarkdown(text) {
  return DOMPurify.sanitize(marked.parse(text));
}

function renderCurrentText() {
  const textEl = current.querySelector('.text');
  textEl.innerHTML = renderMarkdown(currentRaw);
}

function makeThinking() {
  const box = el('div', 'thinking');
  const toggle = el('button', 'thinking-toggle');
  toggle.innerHTML = '<span class="arrow">▶</span><span>已深度思考</span>';
  const body = el('div', 'thinking-body');
  body.hidden = true;
  toggle.addEventListener('click', () => {
    const open = box.classList.toggle('open');
    body.hidden = !open;
  });
  box.appendChild(toggle);
  box.appendChild(body);
  return { box, body };
}

function addToolCall(name, argsText) {
  ensureAssistant();
  const act = ensureActivity();
  act.count += 1;
  act.label.textContent = `工具活动（${act.count}）`;
  const card = el('div', 'tool-card call');
  card.textContent = `▶ ${name}(${argsText})`;
  act.body.appendChild(card);
  if (streaming) {           // 实时执行中自动展开：用户能看到工具进度
    act.box.classList.add('open');
    act.body.hidden = false;
  }
  scrollBottom();
}

function addToolResult(content, isError) {
  const act = current ? current._activity : null;
  const card = el('div', 'tool-card result' + (isError ? ' error' : ''));
  card.textContent = content;
  if (act) act.body.appendChild(card);
  scrollBottom();
}

/* ---------- 会话管理 ---------- */
function clearMessages() {
  messagesEl.innerHTML = '';
  current = null; currentThinking = null; currentRaw = '';
  turnNo = 0;   // 每个会话的回合从 1 起
}

function closeAssistant() {
  current = null; currentThinking = null; currentRaw = '';
}

function renderHistory(history) {
  clearMessages();
  if (!history.length) {
    const hint = el('div', 'hint');
    hint.textContent = '这个会话还是空的——发一条消息开始。';
    messagesEl.appendChild(hint);
    return;
  }
  for (const m of history) {
    if (m.role === 'user') {
      // 真用户消息 = 新回合：先关闭上一个 assistant 节点，再画分隔线 + 气泡
      closeAssistant();
      addUserMessage(m.text);
    } else if (m.role === 'tool_result') {
      // 工具结果消息（内部是 user 角色）：并入当前 assistant 的工具活动块
      if (current) {
        for (const r of m.tool_results) addToolResult(r.content, r.is_error);
      }
    } else if (m.role === 'assistant') {
      closeAssistant();   // 新的一步：强制新建 assistant 节点
      ensureAssistant();
      for (const t of m.tool_calls) addToolCall(t.name, t.arguments);
      if (m.text) {
        currentRaw = m.text;
        renderCurrentText();
      }
      // 保留 current：随后的 tool_result 消息并入它的工具活动块
    }
  }
  closeAssistant();
}

async function loadSessions() {
  try {
    const res = await fetch('/sessions');
    const items = await res.json();
    sessionListEl.innerHTML = '';
    for (const s of items) {
      const item = el('div', 'session-item' + (s.id === currentSid ? ' active' : ''));
      const title = el('div', 'title');
      title.textContent = s.summary;
      const meta = el('div', 'meta');
      meta.textContent = `${s.id} · ${s.events} 事件`;
      item.appendChild(title);
      item.appendChild(meta);
      item.addEventListener('click', () => switchSession(s.id));
      // 非当前会话可删除（当前会话先切换走再删）
      if (s.id !== currentSid) {
        const del = el('button', 'session-del');
        del.textContent = '×';
        del.title = '删除会话';
        del.addEventListener('click', (e) => {
          e.stopPropagation();
          deleteSession(s.id);
        });
        item.appendChild(del);
      }
      sessionListEl.appendChild(item);
    }
  } catch (e) { console.error('load sessions failed', e); }
}

async function switchSession(sid) {
  if (busy || sid === currentSid) return;
  try {
    const res = await fetch(`/sessions/${encodeURIComponent(sid)}/switch`, { method: 'POST' });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    currentSid = data.id;
    renderHistory(data.history);
    loadSessions();
  } catch (e) { console.error('switch session failed', e); }
}

async function deleteSession(sid) {
  if (!confirm(`删除会话「${sid}」？对话记录将不可恢复。`)) return;
  try {
    const res = await fetch(`/sessions/${encodeURIComponent(sid)}/delete`, { method: 'POST' });
    if (!res.ok) {
      const detail = await res.json().catch(() => ({}));
      alert(detail.detail || `删除失败（HTTP ${res.status}）`);
      return;
    }
    loadSessions();
  } catch (e) { console.error('delete session failed', e); }
}

async function newSession() {
  if (busy) return;
  try {
    const res = await fetch('/sessions/new', { method: 'POST' });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    currentSid = data.id;
    renderHistory(data.history);
    loadSessions();
  } catch (e) { console.error('new session failed', e); }
}

/* ---------- SSE 流解析 ---------- */
function handle(payload) {
  switch (payload.type) {
    case 'chunk':
      ensureAssistant();
      currentRaw += payload.text;
      renderCurrentText();   // 流式逐 chunk 渲染 Markdown
      scrollBottom();
      break;
    case 'reasoning': {
      ensureAssistant();
      if (!currentThinking) {
        const t = makeThinking();
        current.insertBefore(t.box, current.firstChild);
        currentThinking = t;
      }
      currentThinking.body.textContent += payload.text;
      break;
    }
    case 'tool_call':
      addToolCall(payload.name, payload.arguments);
      break;
    case 'tool_result':
      addToolResult(payload.content, payload.is_error);
      break;
    case 'turn_end':
      break;
  }
}

async function send() {
  const text = input.value.trim();
  if (!text) return;
  addUserMessage(text);
  input.value = '';
  controller = new AbortController();
  streaming = true;
  setBusy(true);
  try {
    const res = await fetch('/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: text }),
      signal: controller.signal,
    });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buf = '';
    while (true) {
      const { done, value } = await reader.read();
      if (done) break;
      buf += decoder.decode(value, { stream: true });
      let idx;
      while ((idx = buf.indexOf('\n\n')) >= 0) {
        const frame = buf.slice(0, idx);
        buf = buf.slice(idx + 2);
        if (!frame.startsWith('data: ')) continue;
        try { handle(JSON.parse(frame.slice(6))); } catch (e) { console.error('bad frame', e); }
      }
    }
  } catch (e) {
    if (e.name !== 'AbortError') console.error(e);
  } finally {
    current = null; currentThinking = null;
    currentRaw = '';
    streaming = false;
    setBusy(false);
    loadSessions();   // 事件数/摘要已变，刷新会话列表
  }
}

function setBusy(value) {
  busy = value;
  sendBtn.disabled = value;
  input.disabled = value;
  stopBtn.hidden = !value;
  sendBtn.textContent = value ? '…' : '发送';
}

/* ---------- 事件绑定 ---------- */
newBtn.addEventListener('click', newSession);
sendBtn.addEventListener('click', send);
stopBtn.addEventListener('click', () => {
  if (controller) { controller.abort(); stopBtn.hidden = true; }
});
input.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
});
input.addEventListener('input', () => {
  input.style.height = 'auto';
  input.style.height = Math.min(input.scrollHeight, 160) + 'px';
});

/* ---------- 初始化：会话列表 + 当前会话（服务端默认 'web'）历史 ---------- */
currentSid = 'web';
(async function init() {
  await loadSessions();
  try {
    const res = await fetch('/history');
    renderHistory(await res.json());
  } catch (e) { console.error('load history failed', e); }
})();
</script>
</body>
</html>
